# Netlify build & deploy config for Primegate Consultancy
# Static site: no build step. Repo root IS the site root (index.html at top level).

[build]
  publish = "."
  command = ""

# Production context = the `main` branch -> primegateconsultancy.com
[context.production]
  # nothing special; serves as-is

# Staging context = the `staging` branch -> staging--primegateconsultancy.netlify.app
[context.staging]
  # Keep staging out of search engines: the build writes a staging-only _headers
  # file (git-ignored, so it can never reach production). Crawlers can still
  # fetch pages, which they must do to see the noindex.
  command = 'printf "/*\n  X-Robots-Tag: noindex, nofollow\n" > _headers'

# Deploy previews and other branch deploys get the same treatment
[context.deploy-preview]
  command = 'printf "/*\n  X-Robots-Tag: noindex, nofollow\n" > _headers'

[context.branch-deploy]
  command = 'printf "/*\n  X-Robots-Tag: noindex, nofollow\n" > _headers'

# ---- Security headers (all pages) ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ---- Caching (Netlify ignores .htaccess; this replaces it) ----
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS use fixed filenames (no content hash), so they must revalidate on
# every load - otherwise browsers serve a stale stylesheet after an edit.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---- Canonical URLs: 301 every .html to its clean URL (force overrides the static file) ----
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/programmes.html"
  to = "/programmes"
  status = 301
  force = true

# Catalogue build scripts are repo tooling, not site pages
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

