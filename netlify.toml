# Netlify build & deploy config for Primegate Consultancy
# Static site: no build step. Repo root IS the site root (index.html at top level).

[build]
  publish = "."
  command = ""

# Production context = the `main` branch -> primegateconsultancy.com
[context.production]
  # nothing special; serves as-is

# Staging context = the `staging` branch -> staging--primegateconsultancy.netlify.app
[context.staging]
  # Keep staging out of search engines and discovery: tools/staging-build.sh adds
  # a noindex header to every response, serves a minimal robots.txt and drops
  # sitemap.xml / llms.txt from this deploy only. Production runs no build command.
  command = "sh tools/staging-build.sh"

# Deploy previews and other branch deploys get the same treatment
[context.deploy-preview]
  command = "sh tools/staging-build.sh"

[context.branch-deploy]
  command = "sh tools/staging-build.sh"

# ---- Security headers (all pages) ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ---- Caching (Netlify ignores .htaccess; this replaces it) ----
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# CSS/JS use fixed filenames (no content hash), so they must revalidate on
# every load - otherwise browsers serve a stale stylesheet after an edit.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

